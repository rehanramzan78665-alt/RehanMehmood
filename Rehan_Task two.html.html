<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Take the Bait: Phishing Awareness</title>
<style>
:root{--bg:#0e2a33;--panel:#143742;--ink:#eaf3f1;--mute:#9fbcb8;--line:#2a5560;--hook:#ffb347;--ok:#5fd4a0;--bad:#ff6b6b;--paper:#f7f5ee;--pink:#1b1b1b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,button,.tag,nav{font-family:"Trebuchet MS","Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line)}
header b{color:var(--hook);letter-spacing:.5px}
#bar{height:4px;background:var(--line)}#fill{height:100%;width:0;background:var(--hook);transition:width .3s}
main{flex:1;max-width:980px;width:100%;margin:0 auto;padding:36px 24px}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.05;margin:0 0 16px}
h2{font-size:clamp(1.6rem,3.5vw,2.3rem);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 24px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.card h3{margin:0 0 6px;font-size:1.05rem;color:var(--hook)}
.card p{margin:0;font-size:.95rem}
code{background:#0a1e25;padding:2px 6px;border-radius:3px;font-size:.9em;color:var(--hook)}
.good{color:var(--ok)}.bad{color:var(--bad)}
ul{padding-left:20px}li{margin:6px 0}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-top:1px solid var(--line)}
button{background:var(--hook);color:#1a1200;border:0;border-radius:4px;padding:10px 20px;font-weight:700;font-size:1rem;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.hot:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.mail{background:var(--paper);color:var(--pink);border-radius:6px;padding:20px 24px;font:15px/1.6 Arial,sans-serif;margin-bottom:14px}
.mail .hd{border-bottom:1px solid #ccc;padding-bottom:10px;margin-bottom:12px}
.hot{cursor:pointer;border-bottom:2px dashed #c0392b;background:#fff1d6;padding:0 2px}
.hot.found{background:#c9f2dc;border-color:#1e8f5a}
#tip{min-height:64px;background:var(--panel);border-left:4px solid var(--hook);padding:12px 16px;border-radius:4px}
.url{font-family:Consolas,monospace;background:#0a1e25;border-radius:4px;padding:10px 14px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.url s{color:var(--bad)}.url u{color:var(--ok);text-decoration:none}
.ex{border-left:4px solid var(--hook);padding:4px 0 4px 16px;margin:0 0 18px}
.ex h3{margin:0;font-size:1.1rem}.ex p{margin:4px 0 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:400}
.opt.right{border-color:var(--ok);background:#12463a}.opt.wrong{border-color:var(--bad);background:#4a2229}
#fb{margin-top:12px;min-height:50px}
.big{font-size:4rem;font-family:"Trebuchet MS",sans-serif;color:var(--hook);margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><b>DON'T TAKE THE BAIT</b><span id="pg"></span></header>
<div id="bar"><div id="fill"></div></div>
<main id="stage" aria-live="polite"></main>
<nav><button class="alt" id="prev">Back</button><span style="color:var(--mute);font-size:.85rem">Use ← → keys</span><button id="next">Next</button></nav>

<script>
// ---------- Content ----------
const flags=[
 ["support@paypa1-secure.com","The sender domain is <code>paypa1-secure.com</code>, with a number 1 instead of the letter l. Always read the domain, not the display name."],
 ["Dear Customer","Generic greeting. Your real bank or service usually uses your name. (Spear phishing can use your name too, so this alone proves nothing.)"],
 ["within 24 hours","Artificial urgency. Attackers want you to act before you think."],
 ["your account will be permanently closed","A threat of loss or punishment is a classic pressure tactic."],
 ["Verify Account Now","Hover before you click. The link text says one thing, the real destination is a different domain: <code>paypa1-secure.com/login</code>."],
 ["invoice_4471.exe","Unexpected attachment with a risky file type. Never open executables, and be wary of macro-enabled Office files and zip archives."]
];
const examples=[
 ["RSA Security, 2011","Employees received a spear-phishing email titled \"2011 Recruitment Plan\" with an Excel attachment that exploited a flaw. It gave attackers a foothold that led to theft of data related to the company's SecurID products."],
 ["Target, 2013","Attackers phished a refrigeration and HVAC vendor, stole its network credentials, and moved from there into Target's systems. Payment card data of tens of millions of customers was exposed. Lesson: your suppliers are part of your attack surface."],
 ["Twitter, 2020","Attackers phoned Twitter employees pretending to be internal IT and steered them to a fake login page. They took over high-profile accounts to run a bitcoin scam. Lesson: phishing is not only email."],
 ["Uber, 2022","An attacker with a contractor's stolen password spammed the contractor with MFA prompts, then messaged them on WhatsApp posing as IT support and asked them to approve one. Lesson: never approve a login prompt you did not start."]
];
const tactics=[
 ["Urgency","\"Act now or lose access.\" Time pressure shuts down careful thinking."],
 ["Authority","Pretending to be the CEO, IT, HR, the tax office or the police so you comply without questioning."],
 ["Fear","Threats of fines, suspension, legal action or a hacked account."],
 ["Curiosity and greed","Package notifications, \"see who viewed your profile\", prizes, refunds and bonuses."],
 ["Trust and familiarity","Hijacked email threads, spoofed colleagues, fake vendors that you really do work with."],
 ["Pretexting","An invented story, such as a new employee who is locked out, to extract information bit by bit."],
 ["Reciprocity","\"We fixed your problem, now just confirm your details.\" Small favors create a feeling of debt."],
 ["Helpfulness","Attackers count on you wanting to be useful, especially to someone who sounds stressed."]
];
const quiz=[
 ["You get an email from \"IT Support\" asking you to reset your password via a link within 1 hour. What do you do?",["Click quickly, it sounds urgent","Reply asking if it is real","Go to the official portal yourself, or call IT on a known number","Forward it to coworkers as a warning, link included"],2,"Never use the link in the message. Go to the site yourself or verify through a separate, known channel. Do not forward live phishing links."],
 ["Which URL is most likely to be the real Microsoft login?",["microsoft.com-login.secure-verify.net","login.microsoft.com","microsoft-support.login.co","m1crosoft.com/login"],1,"Read the domain right to left from the first single slash. The real domain must come immediately before the first <code>/</code>. In the others, the real owner is a different domain like <code>secure-verify.net</code>."],
 ["Your \"CEO\" texts you to urgently buy gift cards and keep it confidential. This is...",["Likely business email or text compromise","A normal request","Safe if the number looks familiar","Fine if you buy only a small amount"],0,"Urgency, authority and secrecy together are a strong scam signal. Verify by calling the person on a known number."],
 ["An unexpected MFA approval prompt appears on your phone. You should:",["Approve it to make it stop","Deny it, then change your password and report it","Ignore it","Approve once and see what happens"],1,"This is MFA fatigue. Deny, change your password, and tell your security team, because someone likely has your password."],
 ["You clicked a link and entered your password on a suspicious page. First step?",["Hope nothing happens","Delete the email and say nothing","Change the password from a trusted device and report it immediately","Wait to see if there is suspicious activity"],2,"Speed matters. Change the password, revoke sessions, enable MFA, and report. Reporting quickly is never punished by good security teams."],
 ["A QR code on a parking meter sends you to a payment page. This is...",["Always safe","Quishing risk: check the URL and the sticker for tampering","Safe because QR codes cannot be faked","Safe if the page has a padlock icon"],1,"Attackers stick fake QR codes over real ones. A padlock only means the connection is encrypted, not that the site is trustworthy."]
];

// ---------- Slides ----------
const S=[];
S.push(()=>`<h1>Don't take the bait.</h1><p class="sub">Phishing is the most common way attackers get in, because it targets people rather than software. This 15-minute module teaches you to recognize it, understand the psychology behind it, and respond well.</p>
<div class="grid"><div class="card"><h3>Recognize</h3><p>Emails and fake websites</p></div><div class="card"><h3>Understand</h3><p>Social engineering tactics</p></div><div class="card"><h3>Protect</h3><p>Habits that work</p></div><div class="card"><h3>Practice</h3><p>Interactive exercise and quiz</p></div></div>`);

S.push(()=>`<h2>What is phishing?</h2><p class="sub">Fraudulent messages designed to trick you into revealing credentials, paying money, or running malware.</p>
<div class="grid">
<div class="card"><h3>Email phishing</h3><p>Mass messages impersonating banks, delivery firms or tech brands.</p></div>
<div class="card"><h3>Spear phishing</h3><p>Targeted at you, using details about your job and colleagues.</p></div>
<div class="card"><h3>Whaling and BEC</h3><p>Impersonating executives or suppliers to trigger payments.</p></div>
<div class="card"><h3>Smishing</h3><p>The same trick by SMS or messaging apps.</p></div>
<div class="card"><h3>Vishing</h3><p>Phone calls from a fake bank, tech support or IT desk.</p></div>
<div class="card"><h3>Quishing</h3><p>Malicious QR codes that hide the destination link.</p></div></div>`);

S.push(()=>`<h2>How to recognize a phishing email</h2><p class="sub">No single sign proves it. Look for several together.</p>
<div class="grid">
<div class="card"><h3>The sender</h3><p>Check the actual address, not the display name. Look for lookalike domains and a Reply-To that differs from the sender.</p></div>
<div class="card"><h3>The pressure</h3><p>Urgency, threats, or too-good-to-be-true rewards.</p></div>
<div class="card"><h3>The ask</h3><p>Credentials, payment, gift cards, or "open this attachment".</p></div>
<div class="card"><h3>The links</h3><p>Hover to preview the destination. On mobile, long-press.</p></div>
<div class="card"><h3>The attachments</h3><p>Unexpected invoices, zip files, macro-enabled documents, or <code>.exe</code> files.</p></div>
<div class="card"><h3>The quality</h3><p>Odd wording or logos can be a clue, but AI-written phishing is often flawless. Do not rely on typos.</p></div></div>`);

S.push(()=>{window.found=window.found||new Set();return `<h2>Try it: spot the red flags</h2><p class="sub">Click the highlighted parts of this email. Found <b id="cnt">${window.found.size}</b> of ${flags.length}.</p>
<div class="mail"><div class="hd"><b>From:</b> PayPal Service &lt;<span class="hot" tabindex="0" data-i="0">${flags[0][0]}</span>&gt;<br><b>Subject:</b> Action required on your account<br><b>Attachment:</b> <span class="hot" tabindex="0" data-i="5">${flags[5][0]}</span></div>
<span class="hot" tabindex="0" data-i="1">${flags[1][0]}</span>,<br><br>We noticed unusual activity. Please confirm your details <span class="hot" tabindex="0" data-i="2">${flags[2][0]}</span> or <span class="hot" tabindex="0" data-i="3">${flags[3][0]}</span>.<br><br>
<span class="hot" tabindex="0" data-i="4">${flags[4][0]}</span><br><br>Thank you,<br>PayPal Security Team</div>
<div id="tip">Click a highlighted item to see why it is suspicious.</div>`});

S.push(()=>`<h2>Recognizing fake websites</h2><p class="sub">Attackers clone real login pages. The address bar is your best evidence.</p>
<div class="card" style="margin-bottom:14px"><h3>Read the domain, not the whole URL</h3><p>The true owner is the domain just before the first single <code>/</code>.</p>
<div class="url"><s>https://</s><u>bank.com</u><s>.account-verify.ru/login</s> → owner: <b>account-verify.ru</b></div>
<div class="url"><s>https://</s><u>paypal</u><s>-secure-login.com</s> → owner: <b>paypal-secure-login.com</b></div>
<div class="url">https://www.<u>paypal.com</u>/signin → owner: <b class="good">paypal.com</b></div></div>
<ul><li><b>The padlock is not proof.</b> It only means the connection is encrypted. Phishing sites use HTTPS too.</li>
<li><b>Lookalike characters:</b> <code>rn</code> for <code>m</code>, <code>0</code> for <code>o</code>, <code>1</code> for <code>l</code>, or non-Latin letters.</li>
<li><b>Be wary</b> of shortened links, pop-up logins, and pages reached from an ad or message instead of a bookmark.</li>
<li><b>Safest habit:</b> type the address or use a saved bookmark. A password manager will not auto-fill on a fake domain, which is itself a warning.</li></ul>`);

S.push(()=>`<h2>Social engineering: hacking the human</h2><p class="sub">Phishing works because it exploits normal, helpful human instincts. Know the levers and you can feel them being pulled.</p>
<div class="grid">${tactics.map(t=>`<div class="card"><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('')}</div>
<p class="sub" style="margin-top:20px">Ask yourself: <b>"Is this message trying to rush me, scare me, or flatter me?"</b> If yes, slow down.</p>`);

S.push(()=>`<h2>Real-world cases</h2><p class="sub">Even large, well-funded organizations were breached through one human decision.</p>${examples.map(e=>`<div class="ex"><h3>${e[0]}</h3><p>${e[1]}</p></div>`).join('')}`);

S.push(()=>`<h2>Best practices</h2><p class="sub">Habits beat vigilance. Build these in.</p>
<div class="grid">
<div class="card"><h3>Pause and verify</h3><p>Confirm unusual requests through a second channel, such as a call to a number you already have.</p></div>
<div class="card"><h3>Never click, go direct</h3><p>Open the official site or app yourself instead of using links in messages.</p></div>
<div class="card"><h3>Use a password manager</h3><p>Unique passwords everywhere limit the damage of any one leak.</p></div>
<div class="card"><h3>Enable MFA</h3><p>Prefer passkeys or authenticator apps or security keys over SMS codes. Never approve prompts you did not start.</p></div>
<div class="card"><h3>Keep software updated</h3><p>Patches close holes that malicious attachments exploit.</p></div>
<div class="card"><h3>Report, don't delete</h3><p>Use your report-phishing button or tell IT. It protects your coworkers too.</p></div>
<div class="card"><h3>Guard personal info</h3><p>What you post publicly fuels convincing spear phishing.</p></div>
<div class="card"><h3>Never share codes</h3><p>No legitimate support agent will ask for your one-time code or password.</p></div></div>`);

S.push(()=>`<h2>If you think you were phished</h2><p class="sub">Speed matters more than embarrassment.</p>
<div class="grid">
<div class="card"><h3>1. Disconnect</h3><p>If you opened a file, disconnect the device from the network.</p></div>
<div class="card"><h3>2. Change passwords</h3><p>Use a trusted device. Start with the affected account and any that reuse the password.</p></div>
<div class="card"><h3>3. Revoke sessions</h3><p>Sign out of all devices and review MFA methods and mail forwarding rules.</p></div>
<div class="card"><h3>4. Report</h3><p>Tell your IT or security team right away. For money lost, contact your bank at once.</p></div>
<div class="card"><h3>5. Monitor</h3><p>Watch for unusual account activity and consider a fraud alert or credit freeze if personal data was exposed.</p></div></div>`);

// Quiz
let qi=0,score=0,answered=false;
S.push(()=>{qi=0;score=0;answered=false;return `<div id="quiz"></div>`});
function renderQ(){
 const q=quiz[qi],box=document.getElementById('quiz');answered=false;
 box.innerHTML=`<h2>Quiz: question ${qi+1} of ${quiz.length}</h2><p style="font-size:1.1rem">${q[0]}</p>${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}<div id="fb"></div><button id="qn" style="display:none">${qi==quiz.length-1?'See results':'Next question'}</button>`;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(answered)return;answered=true;const i=+b.dataset.i;
  box.querySelectorAll('.opt').forEach((x,j)=>{if(j==q[2])x.classList.add('right');});
  if(i==q[2]){score++;}else b.classList.add('wrong');
  document.getElementById('fb').innerHTML=`<b class="${i==q[2]?'good':'bad'}">${i==q[2]?'Correct.':'Not quite.'}</b> ${q[3]}`;
  document.getElementById('qn').style.display='inline-block';
 });
 document.getElementById('qn').onclick=()=>{qi++;qi<quiz.length?renderQ():renderResult()};
}
function renderResult(){
 const pct=Math.round(score/quiz.length*100);
 const msg=pct>=80?"Strong instincts. Keep staying skeptical and share what you learned.":pct>=50?"Good start. Revisit the red flags and tactics slides, then retry.":"Worth another pass. Review the slides, then retake the quiz.";
 document.getElementById('quiz').innerHTML=`<h2>Your result</h2><p class="big">${score} / ${quiz.length}</p><p class="sub">${msg}</p><button id="retry">Retake quiz</button>`;
 document.getElementById('retry').onclick=()=>{qi=0;score=0;renderQ()};
}

S.push(()=>`<h1>Remember: stop, look, verify.</h1><p class="sub">Slow down when a message creates pressure. Check the sender and the link. Verify through a separate channel. Report anything suspicious.</p>
<div class="card"><h3>Keep learning</h3><p>Try a phishing quiz from Google's Jigsaw team, read your national cyber agency's guidance (such as CISA in the US), and ask your IT team about simulated phishing exercises.</p></div>`);

// ---------- Engine ----------
let cur=0;const stage=document.getElementById('stage');
function show(n){
 cur=Math.max(0,Math.min(S.length-1,n));
 stage.innerHTML=S[cur]();
 document.getElementById('pg').textContent=`${cur+1} / ${S.length}`;
 document.getElementById('fill').style.width=((cur+1)/S.length*100)+'%';
 document.getElementById('prev').disabled=cur==0;
 document.getElementById('next').disabled=cur==S.length-1;
 if(document.getElementById('quiz'))renderQ();
 stage.querySelectorAll('.hot').forEach(h=>{
  const f=()=>{const i=+h.dataset.i;h.classList.add('found');window.found.add(i);
   document.getElementById('tip').innerHTML=`<b>${flags[i][0]}</b><br>${flags[i][1]}`;
   document.getElementById('cnt').textContent=window.found.size;
   if(window.found.size==flags.length)document.getElementById('tip').innerHTML+='<br><br><b class="good">You found all six red flags.</b>';};
  h.onclick=f;h.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();f()}};
  if(window.found.has(+h.dataset.i))h.classList.add('found');
 });
 window.scrollTo(0,0);
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')show(cur+1);if(e.key=='ArrowLeft')show(cur-1)});
show(0);
</script>
</body>
</html>
